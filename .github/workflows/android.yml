# Lex Odak – Android test APK'sı
# Her main güncellemesinde (ya da Actions sekmesinden elle) derlenir ve
# "android-test" sürümüne lex-odak-test.apk olarak konur.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarını www/ klasörüne topla
        run: |
          mkdir www
          rsync -a ./ www/ \
            --exclude .git --exclude .github --exclude www --exclude node_modules --exclude android \
            --exclude package.json --exclude package-lock.json --exclude capacitor.config.json \
            --exclude CNAME --exclude sitemap.xml --exclude robots.txt
          ls -la www | head -50

      - name: Capacitor kur
        run: |
          npm install --no-audit --no-fund
          npx cap --version
          npx cap add android
          npx cap sync android

      - name: Uygulama ikonu
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-maskable-512.png assets/icon-foreground.png
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#762B37' --iconBackgroundColorDark '#762B37' \
            --splashBackgroundColor '#281619' --splashBackgroundColorDark '#281619'

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../lex-odak-test.apk

      - name: Sürüme koy (android-test)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android test sürümü
          prerelease: true
          body: |
            Telefona kurmak için lex-odak-test.apk dosyasını indir.
            Derleme: ${{ github.sha }}
          files: lex-odak-test.apk
