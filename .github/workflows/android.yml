# Lex Odak – Android test APK'sı
# Her main güncellemesinde (ya da Actions sekmesinden elle) derlenir ve
# "android-test" sürümüne lex-odak-test.apk olarak konur.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarını www/ klasörüne topla
        run: |
          mkdir www
          rsync -a ./ www/ \
            --exclude .git --exclude .github --exclude www --exclude node_modules --exclude android \
            --exclude package.json --exclude package-lock.json --exclude capacitor.config.json \
            --exclude android-ayar --exclude CNAME --exclude sitemap.xml --exclude robots.txt
          ls -la www | head -50

      - name: Capacitor kur
        run: |
          npm install --no-audit --no-fund
          npx cap --version
          npx cap add android
          npx cap sync android

      - name: Uygulama ikonu ve açılış ekranı
        run: |
          pip install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image
          ic = Image.open('icon-512.png').convert('RGBA')
          ic.resize((1024, 1024), Image.LANCZOS).save('assets/icon-only.png')
          for ad in ('splash.png', 'splash-dark.png'):
              sp = Image.new('RGBA', (2732, 2732), (0x28, 0x16, 0x19, 255))
              k = ic.resize((600, 600), Image.LANCZOS)
              sp.paste(k, ((2732 - 600) // 2, (2732 - 600) // 2), k)
              sp.convert('RGB').save('assets/' + ad)
          PY
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#762B37' --iconBackgroundColorDark '#762B37' \
            --splashBackgroundColor '#281619' --splashBackgroundColorDark '#281619'
          # Android 8+ uyarlanabilir ikon: web sürümünün maskable ikonu, görünür alana tam oturur (PWA ile aynı görünüm)
          R=android/app/src/main/res
          mkdir -p $R/drawable-nodpi $R/drawable $R/mipmap-anydpi-v26
          cp icon-maskable-512.png $R/drawable-nodpi/lex_ikon_tam.png
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<inset xmlns:android="http://schemas.android.com/apk/res/android" android:drawable="@drawable/lex_ikon_tam" android:inset="9dp"/>' \
            > $R/drawable/lex_ikon_on.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="270" android:startColor="#902739" android:endColor="#4D1A22"/></shape>' \
            > $R/drawable/lex_ikon_zemin.xml
          for f in ic_launcher ic_launcher_round; do
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '  <background android:drawable="@drawable/lex_ikon_zemin"/>' \
              '  <foreground android:drawable="@drawable/lex_ikon_on"/>' \
              '</adaptive-icon>' > $R/mipmap-anydpi-v26/$f.xml
          done
          cat $R/mipmap-anydpi-v26/ic_launcher.xml

      - name: Sistem çubukları (MainActivity)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > "$F" <<'JAVA'
          package com.lexodak.app;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          // Web görünümü durum çubuğu, görev çubuğu ve klavyenin arasında kalır (Chrome'daki PWA gibi)
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  View web = getBridge().getWebView();
                  View kap = (View) web.getParent();
                  kap.setBackgroundColor(Color.parseColor("#281619"));
                  ViewCompat.setOnApplyWindowInsetsListener(kap, (v, ins) -> {
                      Insets i = ins.getInsets(WindowInsetsCompat.Type.systemBars()
                              | WindowInsetsCompat.Type.displayCutout()
                              | WindowInsetsCompat.Type.ime());
                      v.setPadding(i.left, i.top, i.right, i.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  ViewCompat.requestApplyInsets(kap);
              }
          }
          JAVA
          head -5 "$F"

      - name: APK derle
        working-directory: android
        run: |
          # sabit test imzası: yeni sürüm eskisinin üzerine kurulabilsin (yalnız test içindir, Play imzası değildir)
          mkdir -p ~/.android && cp ../android-ayar/test-imza.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../lex-odak-test.apk

      - name: Sürüme koy (android-test)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android test sürümü
          prerelease: true
          body: |
            Telefona kurmak için lex-odak-test.apk dosyasını indir.
            Derleme: ${{ github.sha }}
          files: lex-odak-test.apk
