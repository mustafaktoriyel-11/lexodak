# Lex Odak – mevzuat araçları
# Şimdilik: mevzuat-arac/kanunlar.json'daki kanunların resmî PDF'lerini mevzuat.gov.tr'den indirir,
# "mevzuat-kaynak" sürümüne mevzuat-pdf.zip olarak koyar (ayıklayıcı geliştirme ve doğrulama için).
name: Mevzuat

on:
  push:
    branches: [main]
    paths: ['mevzuat-arac/kanunlar.json', '.github/workflows/mevzuat.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resmî PDF'leri indir
        run: |
          mkdir -p pdf
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36"
          for no in $(python3 -c "import json;print(' '.join(k['no'] for k in json.load(open('mevzuat-arac/kanunlar.json'))))"); do
            ok=""
            for tertip in 5 4 3 6 7; do
              curl -sS -L -A "$UA" -o /tmp/k.pdf "https://www.mevzuat.gov.tr/MevzuatMetin/1.${tertip}.${no}.pdf" || continue
              if head -c 5 /tmp/k.pdf | grep -q "%PDF"; then mv /tmp/k.pdf "pdf/${no}.pdf"; echo "$no tertip $tertip $(stat -c%s pdf/${no}.pdf)" | tee -a pdf/liste.txt; ok=1; break; fi
              sleep 1
            done
            [ -z "$ok" ] && echo "$no BULUNAMADI" | tee -a pdf/liste.txt
            sleep 1
          done
          date -u +%Y-%m-%dT%H:%M:%SZ > pdf/indirme-zamani.txt
          cd pdf && zip -q -r ../mevzuat-pdf.zip . && cd .. && ls -la mevzuat-pdf.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mevzuat-kaynak
          name: Mevzuat kaynak PDF'leri (geliştirme)
          prerelease: true
          body: mevzuat.gov.tr resmî PDF'leri; yalnız ayıklayıcı geliştirme/doğrulama için.
          files: mevzuat-pdf.zip
